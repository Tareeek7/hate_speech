  b.querySelector(".val").textContent=fmt(d[2]);

  b.addEventListener("pointermove",function(e){if(e.pointerType==="mouse")place(e.clientX,e.clientY)});
  b.addEventListener("pointerleave",function(e){if(e.pointerType==="mouse")hide()});
  b.addEventListener("click",function(e){
    if(e.pointerType==="mouse")return;
    e.stopPropagation();
    if(cur===d){hide();return}
    show(d,b);atRow(b);
  });
  b.addEventListener("focus",function(){show(d,b);atRow(b)});
  b.addEventListener("blur",hide);
  list.appendChild(b);
});
document.addEventListener("click",function(){if(cur)hide()});
requestAnimationFrame(function(){requestAnimationFrame(function(){list.classList.add("in")})});
</script>
</body>
